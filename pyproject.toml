[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glm-ladder"
version = "0.1.0"
description = "A 25M-200M family of GLM-5.3-Flash-inspired MoE language models trained from scratch"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["glm_ladder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
